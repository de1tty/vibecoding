<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyCamp — Изучай Python бесплатно</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<style>
:root{
  --primary:#0a0a23;
  --primary-light:#1b1b32;
  --accent:#2ec4b6;
  --accent-hover:#25a99c;
  --accent-soft:rgba(46,196,182,.12);
  --bg:#f5f6fa;
  --card:#ffffff;
  --text:#1b1b32;
  --text-mid:#4b5563;
  --text-light:#6b7280;
  --border:#e5e7eb;
  --success:#10b981;
  --success-soft:rgba(16,185,129,.12);
  --error:#ef4444;
  --error-soft:rgba(239,68,68,.12);
  --warning:#f59e0b;
  --code-bg:#1e1e2e;
  --code-text:#cdd6f4;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 10px 30px rgba(0,0,0,.1);
  --radius:8px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
}
/* Header */
.header{
  background:var(--primary);
  color:#fff;
  height:56px;
  display:flex;
  align-items:center;
  padding:0 24px;
  gap:24px;
  flex-shrink:0;
  box-shadow:var(--shadow);
  z-index:100;
}
.logo{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:20px;
  font-weight:800;
  cursor:pointer;
  user-select:none;
}
.logo-icon{
  background:var(--accent);
  color:var(--primary);
  width:32px;height:32px;
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;
  font-size:18px;
}
.header-nav{display:flex;gap:8px;align-items:center;flex:1}
.nav-link{
  color:#c9c9d6;
  text-decoration:none;
  padding:6px 12px;
  border-radius:6px;
  font-size:14px;
  cursor:pointer;
  transition:background .15s,color .15s;
}
.nav-link:hover{background:rgba(255,255,255,.08);color:#fff}
.progress-wrap{display:flex;align-items:center;gap:10px;font-size:13px;color:#c9c9d6}
.progress-bar{
  width:160px;height:6px;
  background:rgba(255,255,255,.15);
  border-radius:3px;
  overflow:hidden;
}
.progress-fill{
  height:100%;
  background:var(--accent);
  border-radius:3px;
  transition:width .4s ease;
}
.btn-icon{
  background:rgba(255,255,255,.08);
  border:none;color:#fff;
  width:36px;height:36px;
  border-radius:8px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
  transition:background .15s;
}
.btn-icon:hover{background:rgba(255,255,255,.15)}
/* Layout */
.layout{
  display:flex;
  flex:1;
  overflow:hidden;
}
/* Sidebar */
.sidebar{
  width:300px;
  background:var(--card);
  border-right:1px solid var(--border);
  overflow-y:auto;
  flex-shrink:0;
}
.sidebar-header{
  padding:16px 20px;
  border-bottom:1px solid var(--border);
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:.5px;
  color:var(--text-light);
  font-weight:700;
}
.module{border-bottom:1px solid var(--border)}
.module-header{
  padding:12px 20px;
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
  font-weight:600;
  font-size:14px;
  transition:background .12s;
  user-select:none;
}
.module-header:hover{background:var(--bg)}
.module-icon{font-size:18px}
.module-title{flex:1}
.module-count{
  font-size:12px;
  color:var(--text-light);
  background:var(--bg);
  padding:2px 8px;
  border-radius:10px;
}
.module-chev{transition:transform .2s;color:var(--text-light);font-size:12px}
.module.collapsed .module-chev{transform:rotate(-90deg)}
.lessons{
  overflow:hidden;
  max-height:2000px;
  transition:max-height .3s ease;
}
.module.collapsed .lessons{max-height:0}
.lesson-item{
  padding:8px 20px 8px 48px;
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
  font-size:13px;
  color:var(--text-mid);
  transition:background .12s,color .12s;
  position:relative;
}
.lesson-item:hover{background:var(--bg);color:var(--text)}
.lesson-item.active{
  background:var(--accent-soft);
  color:var(--accent);
  font-weight:600;
}
.lesson-item.active::before{
  content:'';
  position:absolute;
  left:0;top:0;bottom:0;
  width:3px;
  background:var(--accent);
}
.lesson-check{
  width:18px;height:18px;
  border-radius:50%;
  border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;
  flex-shrink:0;
}
.lesson-item.completed .lesson-check{
  background:var(--success);
  border-color:var(--success);
  color:#fff;
}
.lesson-item.completed .lesson-check::after{content:'✓'}
.lesson-item .lesson-check{color:transparent}
/* Main content */
.content{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.content-header{
  padding:16px 24px;
  border-bottom:1px solid var(--border);
  background:var(--card);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-shrink:0;
}
.breadcrumb{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  color:var(--text-light);
}
.breadcrumb b{color:var(--text)}
.lesson-title{
  font-size:20px;
  font-weight:700;
  margin-top:2px;
}
.content-actions{display:flex;gap:8px}
.btn{
  padding:8px 16px;
  border-radius:6px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  font-size:14px;
  cursor:pointer;
  font-weight:500;
  transition:all .15s;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.btn:hover{background:var(--bg)}
.btn-primary{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
}
.btn-primary:hover{background:var(--accent-hover)}
.btn-ghost{border-color:transparent}
.btn-ghost:hover{background:var(--bg)}
/* Workspace: instructions + editor */
.workspace{
  flex:1;
  display:flex;
  overflow:hidden;
}
.instructions{
  width:40%;
  min-width:320px;
  padding:24px;
  overflow-y:auto;
  background:var(--card);
  border-right:1px solid var(--border);
  font-size:15px;
  line-height:1.7;
}
.instructions h2{font-size:22px;margin-bottom:12px;color:var(--text)}
.instructions h3{font-size:17px;margin:20px 0 8px;color:var(--text)}
.instructions p{margin-bottom:14px;color:var(--text-mid)}
.instructions ul,.instructions ol{margin:0 0 14px 22px;color:var(--text-mid)}
.instructions li{margin-bottom:6px}
.instructions code{
  background:var(--bg);
  padding:2px 6px;
  border-radius:4px;
  font-family:'Consolas','Monaco',monospace;
  font-size:13px;
  color:var(--accent);
}
.instructions pre{
  background:var(--code-bg);
  color:var(--code-text);
  padding:14px 16px;
  border-radius:8px;
  overflow-x:auto;
  margin:0 0 14px;
  font-size:13px;
  line-height:1.5;
}
.instructions pre code{
  background:transparent;
  color:inherit;
  padding:0;
}
.instructions blockquote{
  border-left:3px solid var(--accent);
  padding:8px 14px;
  background:var(--accent-soft);
  border-radius:0 6px 6px 0;
  margin-bottom:14px;
  color:var(--text-mid);
}
.task-box{
  background:var(--bg);
  border:1px solid var(--border);
  border-left:3px solid var(--warning);
  padding:14px 16px;
  border-radius:6px;
  margin:16px 0;
}
.task-box h4{font-size:14px;margin-bottom:8px;color:var(--text);text-transform:uppercase;letter-spacing:.5px}
.task-box ul{margin:0 0 0 18px}
.task-box li{margin-bottom:4px;font-size:14px}
.hint-box{
  background:var(--accent-soft);
  border-radius:6px;
  padding:12px 14px;
  margin-top:16px;
  display:none;
}
.hint-box.show{display:block}
.hint-box h4{font-size:13px;color:var(--accent);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
/* Editor pane */
.editor-pane{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.editor-toolbar{
  padding:8px 16px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
}
.editor-toolbar .file-tab{
  display:flex;align-items:center;gap:6px;
  padding:6px 12px;
  background:var(--code-bg);
  color:#a5a5c9;
  border-radius:6px 6px 0 0;
  font-size:13px;
  font-family:monospace;
}
.file-tab .dot{color:var(--accent)}
.editor-actions{margin-left:auto;display:flex;gap:8px}
.CodeMirror{
  flex:1;
  height:auto !important;
  font-size:14px;
  font-family:'Consolas','Monaco','Courier New',monospace;
}
.CodeMirror-scroll{height:auto}
/* Console */
.console{
  height:200px;
  min-height:80px;
  background:#1a1b26;
  color:#c0caf5;
  font-family:'Consolas','Monaco',monospace;
  font-size:13px;
  padding:12px 16px;
  overflow-y:auto;
  flex-shrink:0;
  border-top:2px solid #2a2b3d;
}
.console-line{white-space:pre-wrap;word-break:break-word;line-height:1.6}
.console-line.error{color:#f7768e}
.console-line.success{color:#9ece6a}
.console-line.info{color:#7aa2f7}
.console-line.system{color:#565f89;font-style:italic}
.console:empty::before{
  content:'Консоль Python. Запустите код, чтобы увидеть результат.';
  color:#565f89;font-style:italic;
}
/* Footer nav */
.footer-nav{
  padding:12px 24px;
  background:var(--card);
  border-top:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-shrink:0;
}
.lesson-dots{display:flex;gap:6px}
.dot-nav{
  width:8px;height:8px;
  border-radius:50%;
  background:var(--border);
  cursor:pointer;
  transition:background .15s;
}
.dot-nav:hover{background:var(--text-light)}
.dot-nav.active{background:var(--accent);transform:scale(1.3)}
.dot-nav.completed{background:var(--success)}
/* Loading overlay */
.loading-overlay{
  position:fixed;
  inset:0;
  background:var(--primary);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:1000;
  color:#fff;
  transition:opacity .4s;
}
.loading-overlay.hidden{opacity:0;pointer-events:none}
.loading-logo{
  font-size:36px;
  font-weight:900;
  margin-bottom:24px;
  display:flex;align-items:center;gap:12px;
}
.loading-logo .logo-icon{width:56px;height:56px;font-size:28px;border-radius:14px}
.spinner{
  width:48px;height:48px;
  border:4px solid rgba(255,255,255,.15);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{margin-top:20px;font-size:15px;color:#c9c9d6}
.loading-sub{margin-top:8px;font-size:13px;color:#7a7a96}
/* Modal */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:200;
  padding:24px;
}
.modal-overlay.show{display:flex}
.modal{
  background:var(--card);
  border-radius:12px;
  max-width:560px;
  width:100%;
  padding:32px;
  box-shadow:var(--shadow-lg);
  text-align:center;
}
.modal-icon{font-size:48px;margin-bottom:16px}
.modal h2{font-size:24px;margin-bottom:12px}
.modal p{color:var(--text-mid);margin-bottom:24px;line-height:1.6}
.modal-actions{display:flex;gap:12px;justify-content:center}
/* Test results */
.test-results{
  background:var(--card);
  border-top:1px solid var(--border);
  max-height:0;
  overflow:hidden;
  transition:max-height .3s;
}
.test-results.show{max-height:300px;overflow-y:auto}
.test-list{padding:12px 16px}
.test-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 12px;
  border-radius:6px;
  font-size:13px;
  margin-bottom:4px;
}
.test-item.pass{background:var(--success-soft);color:#065f46}
.test-item.fail{background:var(--error-soft);color:#991b1b}
.test-icon{font-weight:700;width:18px}
/* Toast */
.toast{
  position:fixed;
  top:72px;right:24px;
  background:var(--primary);
  color:#fff;
  padding:12px 20px;
  border-radius:8px;
  box-shadow:var(--shadow-lg);
  z-index:300;
  transform:translateX(420px);
  transition:transform .3s ease;
  font-size:14px;
  display:flex;align-items:center;gap:10px;
}
.toast.show{transform:translateX(0)}
.toast.success{border-left:4px solid var(--success)}
.toast.error{border-left:4px solid var(--error)}
/* Mobile */
.menu-toggle{display:none}
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:56px;bottom:0;transform:translateX(-100%);transition:transform .25s;z-index:50;box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:translateX(0)}
  .workspace{flex-direction:column}
  .instructions{width:100%;min-width:0;border-right:none;border-bottom:1px solid var(--border);max-height:40%}
  .menu-toggle{display:flex}
  .header-nav{display:none}
  .progress-bar{width:80px}
}
/* Scrollbars */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.25)}
.sidebar ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.1)}
.console::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15)}
</style>
</head>
<body>

<!-- Loading overlay -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-logo">
    <div class="logo-icon">Py</div>
    <span>PyCamp</span>
  </div>
  <div class="spinner"></div>
  <div class="loading-text">Загрузка среды Python...</div>
  <div class="loading-sub" id="loadingSub">Подготовка интерпретатора Pyodide</div>
</div>

<!-- Header -->
<header class="header">
  <button class="btn-icon menu-toggle" id="menuToggle" title="Меню">☰</button>
  <div class="logo" onclick="goHome()">
    <div class="logo-icon">Py</div>
    <span>PyCamp</span>
  </div>
  <nav class="header-nav">
    <a class="nav-link" onclick="goCurriculum()">Программа курса</a>
    <a class="nav-link" onclick="goForum()">Форум</a>
    <a class="nav-link" onclick="goCert()">Сертификат</a>
    <a class="nav-link" onclick="goAbout()">О проекте</a>
  </nav>
  <div class="progress-wrap">
    <span id="progressText">0%</span>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <button class="btn-icon" onclick="resetProgress()" title="Сбросить прогресс">↺</button>
  </div>
</header>

<!-- Layout -->
<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">Учебная программа</div>
    <div id="moduleList"></div>
  </aside>

  <!-- Content -->
  <main class="content">
    <div class="content-header">
      <div>
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="lesson-title" id="lessonTitle"></div>
      </div>
      <div class="content-actions">
        <button class="btn btn-ghost" id="hintBtn" onclick="toggleHint()">💡 Подсказка</button>
        <button class="btn btn-ghost" onclick="showSolution()">📝 Решение</button>
        <button class="btn btn-ghost" onclick="resetCode()">🗑 Сброс</button>
      </div>
    </div>

    <div class="workspace">
      <!-- Instructions -->
      <div class="instructions" id="instructions"></div>

      <!-- Editor pane -->
      <div class="editor-pane">
        <div class="editor-toolbar">
          <div class="file-tab"><span class="dot">●</span> main.py</div>
          <div class="editor-actions">
            <button class="btn btn-primary" id="runBtn" onclick="runCode()">▶ Запустить</button>
          </div>
        </div>
        <textarea id="codeEditor"></textarea>
        <div class="test-results" id="testResults">
          <div class="test-list" id="testList"></div>
        </div>
        <div class="console" id="console"></div>
      </div>
    </div>

    <!-- Footer nav -->
    <div class="footer-nav">
      <button class="btn" id="prevBtn" onclick="prevLesson()">← Предыдущий</button>
      <div class="lesson-dots" id="lessonDots"></div>
      <button class="btn btn-primary" id="nextBtn" onclick="nextLesson()">Следующий →</button>
    </div>
  </main>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-icon" id="modalIcon">🎉</div>
    <h2 id="modalTitle">Поздравляем!</h2>
    <p id="modalText"></p>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Закрыть</button>
      <button class="btn btn-primary" id="modalAction" onclick="closeModal()">Продолжить</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>

<script>
/* ============================================================
   КУРС PYTHON — ДАННЫЕ УРОКОВ
   ============================================================ */
const CURRICULUM = [
/* ===================== МОДУЛЬ 1: ОСНОВЫ ===================== */
{
  id:'basics', title:'Основы Python', icon:'🐍',
  lessons:[
    {
      id:'what-is-python',
      title:'Что такое Python?',
      desc:'Знакомство с языком',
      content:`
<h2>Добро пожаловать в PyCamp!</h2>
<p><b>Python</b> — один из самых популярных языков программирования в мире. Он используется в веб-разработке, анализе данных, машинном обучении, автоматизации, научных расчётах и многих других областях.</p>
<h3>Почему Python?</h3>
<ul>
<li><b>Простой синтаксис</b> — код читается почти как обычный английский текст</li>
<li><b>Универсальность</b> — от скриптов до нейросетей</li>
<li><b>Огромное сообщество</b> — тысячи библиотек и обучающих материалов</li>
<li><b>Высокая зарплата</b> — Python-разработчики входят в топ по доходам</li>
</ul>
<blockquote>Python был создан Гвидо ван Россумом в 1991 году. Название языка происходит не от змеи, а от британского комедийного шоу «Летающий цирк Монти Пайтона».</blockquote>
<h3>Как устроен этот курс</h3>
<p>Каждый урок содержит:</p>
<ol>
<li><b>Теорию</b> — объяснение концепции с примерами</li>
<li><b>Редактор кода</b> — здесь вы пишете Python-код</li>
<li><b>Кнопку «Запустить»</b> — выполняет код прямо в браузере</li>
<li><b>Тесты</b> — проверяют, правильно ли решена задача</li>
</ol>
<p>Готовы начать? Перейдите к следующему уроку и напишите свою первую программу!</p>
`,
      starter:'# Это ваша первая программа на Python!\n# Нажмите "Запустить", чтобы увидеть результат.\n\nprint("Привет, мир!")\n',
      solution:'print("Привет, мир!")\n',

/* ============================================================

   ============================================================ */

// Состояние
let state = {
  pyodideReady: false,
  currentLessonId: null,
  completedLessons: {},  // {lessonId: true}
};

// Разворачиваем курс в плоский список уроков для навигации
const ALL_LESSONS = [];
CURRICULUM.forEach(module => {
  module.lessons.forEach(lesson => {
    ALL_LESSONS.push({ ...lesson, moduleId: module.id, moduleTitle: module.title, moduleIcon: module.icon });
  });
});

// DOM-ссылки
const $ = id => document.getElementById(id);
const dom = {
  loadingOverlay: $('loadingOverlay'),
  loadingSub: $('loadingSub'),
  sidebar: $('sidebar'),
  moduleList: $('moduleList'),
  breadcrumb: $('breadcrumb'),
  lessonTitle: $('lessonTitle'),
  instructions: $('instructions'),
  codeEditor: $('codeEditor'),
  console: $('console'),
  testResults: $('testResults'),
  testList: $('testList'),
  lessonDots: $('lessonDots'),
  prevBtn: $('prevBtn'),
  nextBtn: $('nextBtn'),
  runBtn: $('runBtn'),
  progressText: $('progressText'),
  progressFill: $('progressFill'),
  toast: $('toast'),
  modal: $('modal'),
  modalIcon: $('modalIcon'),
  modalTitle: $('modalTitle'),
  modalText: $('modalText'),
  hintBtn: $('hintBtn'),
};

let editor = null;
let pyodide = null;

/* ---------- Инициализация ---------- */

async function initApp() {
  // Загружаем прогресс из localStorage
  loadProgress();

  // Рендерим сайдбар
  renderSidebar();

  // Инициализируем редактор CodeMirror
  editor = CodeMirror.fromTextArea(dom.codeEditor, {
    mode: 'python',
    theme: 'material-darker',
    lineNumbers: true,
    indentUnit: 4,
    tabSize: 4,
    indentWithTabs: false,
    autoCloseBrackets: true,
    matchBrackets: true,
    lineWrapping: false,
  });

  // Загружаем последний урок или первый
  const lastLesson = localStorage.getItem('pycamp_current_lesson');
  const startId = lastLesson || ALL_LESSONS[0].id;
  loadLesson(startId);

  // Инициализируем Pyodide
  try {
    dom.loadingSub.textContent = 'Загружаем интерпретатор Pyodide (~10 МБ)...';
    pyodide = await loadPyodide({
      indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/',
    });
    state.pyodideReady = true;
    setTimeout(() => {
      dom.loadingOverlay.classList.add('hidden');
      setTimeout(() => dom.loadingOverlay.style.display = 'none', 400);
    }, 400);
  } catch (e) {
    dom.loadingSub.innerHTML = '<span style="color:#f7768e">Ошибка загрузки Pyodide. Проверьте интернет.</span>';
    console.error('Pyodide load error:', e);
  }

  // Обновляем прогресс-бар
  updateProgress();

  // Назначаем горячую клавишу Ctrl+Enter для запуска
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      runCode();
    }
  });
}

/* ---------- Рендеринг сайдбара ---------- */

function renderSidebar() {
  dom.moduleList.innerHTML = '';
  CURRICULUM.forEach((module, mi) => {
    const moduleEl = document.createElement('div');
    moduleEl.className = 'module';
    moduleEl.dataset.moduleId = module.id;

    const header = document.createElement('div');
    header.className = 'module-header';
    header.innerHTML = `
      <span class="module-icon">${module.icon}</span>
      <span class="module-title">${module.title}</span>
      <span class="module-count">${module.lessons.length}</span>
      <span class="module-chev">▼</span>
    `;
    header.onclick = () => moduleEl.classList.toggle('collapsed');

    const lessonsEl = document.createElement('div');
    lessonsEl.className = 'lessons';

    module.lessons.forEach(lesson => {
      const lessonEl = document.createElement('div');
      lessonEl.className = 'lesson-item';
      lessonEl.dataset.lessonId = lesson.id;
      if (state.completedLessons[lesson.id]) {
        lessonEl.classList.add('completed');
      }
      lessonEl.innerHTML = `
        <span class="lesson-check"></span>
        <span>${lesson.title}</span>
      `;
      lessonEl.onclick = () => loadLesson(lesson.id);
      lessonsEl.appendChild(lessonEl);
    });

    moduleEl.appendChild(header);
    moduleEl.appendChild(lessonsEl);
    dom.moduleList.appendChild(moduleEl);
  });
}

/* ---------- Загрузка урока ---------- */

function findLesson(id) {
  return ALL_LESSONS.find(l => l.id === id);
}

function loadLesson(id) {
  const lesson = findLesson(id);
  if (!lesson) return;

  state.currentLessonId = id;
  localStorage.setItem('pycamp_current_lesson', id);

  // Обновляем активный элемент в сайдбаре
  document.querySelectorAll('.lesson-item').forEach(el => {
    el.classList.toggle('active', el.dataset.lessonId === id);
  });

  // Раскрываем модуль, если он свёрнут
  const module = CURRICULUM.find(m => m.id === lesson.moduleId);
  if (module) {
    const moduleEl = document.querySelector(`[data-module-id="${module.id}"]`);
    if (moduleEl) moduleEl.classList.remove('collapsed');
  }

  // Заполняем breadcrumb и заголовок
  dom.breadcrumb.innerHTML = `<span>${module ? module.icon + ' ' + module.title : ''}</span>`;
  dom.lessonTitle.textContent = lesson.title;

  // Заполняем инструкции
  dom.instructions.innerHTML = lesson.content;
  // Добавляем блок подсказки
  const hintBox = document.createElement('div');
  hintBox.className = 'hint-box';
  hintBox.id = 'hintBox';
  hintBox.innerHTML = `<h4>💡 Подсказка</h4><p style="margin:0;color:var(--text-mid);white-space:pre-wrap">${lesson.hint}</p>`;
  dom.instructions.appendChild(hintBox);

  // Устанавливаем код в редактор
  editor.setValue(lesson.starter || '');

  // Очищаем консоль и результаты тестов
  dom.console.innerHTML = '';
  dom.testResults.classList.remove('show');
  dom.testList.innerHTML = '';

  // Прокручиваем инструкции наверх
  dom.instructions.scrollTop = 0;

  // Обновляем точки навигации
  renderLessonDots();

  // Обновляем кнопки навигации
  updateNavButtons();

  // Прокрутка редактора наверх
  setTimeout(() => editor.refresh(), 50);

  // Закрываем мобильное меню
  dom.sidebar.classList.remove('open');
}

/* ---------- Точки навигации ---------- */

function renderLessonDots() {
  dom.lessonDots.innerHTML = '';
  ALL_LESSONS.forEach(lesson => {
    const dot = document.createElement('div');
    dot.className = 'dot-nav';
    if (lesson.id === state.currentLessonId) dot.classList.add('active');
    if (state.completedLessons[lesson.id]) dot.classList.add('completed');
    dot.title = lesson.title;
    dot.onclick = () => loadLesson(lesson.id);
    dom.lessonDots.appendChild(dot);
  });
}

/* ---------- Навигация ---------- */

function updateNavButtons() {
  const idx = ALL_LESSONS.findIndex(l => l.id === state.currentLessonId);
  dom.prevBtn.disabled = idx <= 0;
  dom.prevBtn.style.opacity = idx <= 0 ? '0.4' : '1';
  dom.nextBtn.disabled = idx >= ALL_LESSONS.length - 1;
  dom.nextBtn.style.opacity = idx >= ALL_LESSONS.length - 1 ? '0.4' : '1';
}

function prevLesson() {
  const idx = ALL_LESSONS.findIndex(l => l.id === state.currentLessonId);
  if (idx > 0) loadLesson(ALL_LESSONS[idx - 1].id);
}

function nextLesson() {
  const idx = ALL_LESSONS.findIndex(l => l.id === state.currentLessonId);
  if (idx < ALL_LESSONS.length - 1) loadLesson(ALL_LESSONS[idx + 1].id);
}

/* ---------- Запуск кода ---------- */

function runCode() {
  if (!state.pyodideReady) {
    showToast('⏳ Среда Python ещё загружается...', 'error');
    return;
  }
  const code = editor.getValue();
  dom.console.innerHTML = '';
  dom.testResults.classList.remove('show');
  dom.testList.innerHTML = '';

  // Перехват stdout/stderr с одновременным выводом в консоль
  let capturedOutput = '';
  pyodide.setStdout({ batched: (text) => {
    capturedOutput += text;
    addToConsole(text, 'normal');
  }});
  pyodide.setStderr({ batched: (text) => {
    capturedOutput += text;
    addToConsole(text, 'error');
  }});

  try {
    // Прогоняем код пользователя (globals сохраняются между вызовами)
    pyodide.runPython(code);
  } catch (e) {
    addToConsole(e.message || String(e), 'error');
    return;
  }

  // Если у урока есть тесты — запускаем их
  const lesson = findLesson(state.currentLessonId);
  if (lesson && lesson.tests && lesson.tests.length > 0) {
    runTests(lesson.tests, capturedOutput);
  }
}

/* ---------- Консоль ---------- */

function addToConsole(text, type = 'normal') {
  const line = document.createElement('div');
  line.className = 'console-line' + (type === 'error' ? ' error' : ' info');
  line.textContent = text;
  dom.console.appendChild(line);
  dom.console.scrollTop = dom.console.scrollHeight;
}

/* ---------- Тесты ---------- */

function runTests(tests, capturedOutput) {
  const results = [];
  let allPassed = true;

  tests.forEach((test, i) => {
    let passed = false;
    let detail = '';

    try {
      if (test.type === 'output') {
        // Сравниваем захваченный stdout
        const actual = (capturedOutput || '').trim();
        const expected = (test.expected || '').trim();
        passed = actual === expected;
        detail = passed ? 'OK' : `ожидалось: "${expected}", получено: "${actual}"`;
      } else if (test.type === 'has') {
        // Проверяем, что код содержит строку
        const code = editor.getValue();
        passed = code.includes(test.code);
        detail = passed ? 'OK' : `код не содержит: "${test.code}"`;
      } else if (test.type === 'eval') {
        // Вычисляем Python-выражение и сравниваем str()
        let val = pyodide.runPython(`str(${test.expr})`);
        val = String(val);
        const expected = String(test.expected);
        passed = val === expected;
        detail = passed ? 'OK' : `ожидалось: "${expected}", получено: "${val}"`;
      }
    } catch (e) {
      passed = false;
      detail = 'ошибка: ' + (e.message || String(e));
    }

    if (!passed) allPassed = false;
    results.push({ passed, detail, test });
  });

  // Показываем результаты
  dom.testResults.classList.add('show');
  dom.testList.innerHTML = '';
  results.forEach((r, i) => {
    const item = document.createElement('div');
    item.className = 'test-item ' + (r.passed ? 'pass' : 'fail');
    const icon = r.passed ? '✓' : '✗';
    const label = r.test.type === 'output' ? `Проверка вывода` :
                  r.test.type === 'has' ? `Проверка кода` :
                  r.test.type === 'eval' ? `Проверка значения (${r.test.expr})` : `Тест ${i+1}`;
    item.innerHTML = `<span class="test-icon">${icon}</span><span><b>${label}</b> — ${r.detail}</span>`;
    dom.testList.appendChild(item);
  });

  // Если все тесты пройдены
  if (allPassed) {
    markLessonCompleted(state.currentLessonId);
    showToast('🎉 Все тесты пройдены!', 'success');
    // Показываем модалку, если это последний урок или впервые завершён
    const lesson = findLesson(state.currentLessonId);
    if (lesson.id === 'final-project') {
      showModal('🏆', 'Курс завершён!', `Поздравляем! Вы прошли весь курс Python. Это огромное достижение. Теперь вы знаете основы Python: переменные, строки, структуры данных, циклы, функции, классы и многое другое. Продолжайте практиковаться и стройте реальные проекты!`);
    } else {
      const idx = ALL_LESSONS.findIndex(l => l.id === state.currentLessonId);
      if (idx < ALL_LESSONS.length - 1) {
        setTimeout(() => {
          showModal('✅', 'Урок пройден!', `Отличная работа! Вы завершили урок «${lesson.title}». Переходите к следующему, чтобы продолжить обучение.`);
          dom.modalAction.onclick = () => { closeModal(); nextLesson(); };
        }, 600);
      }
    }
  } else {
    const failedCount = results.filter(r => !r.passed).length;
    showToast(`❌ Не пройдено тестов: ${failedCount}`, 'error');
  }
}

/* ---------- Прогресс ---------- */

function markLessonCompleted(id) {
  if (!state.completedLessons[id]) {
    state.completedLessons[id] = true;
    saveProgress();
    updateProgress();
    // Обновляем чекбокс в сайдбаре
    const el = document.querySelector(`.lesson-item[data-lesson-id="${id}"]`);
    if (el) el.classList.add('completed');
    renderLessonDots();
  }
}

function updateProgress() {
  const total = ALL_LESSONS.length;
  const done = Object.keys(state.completedLessons).filter(k => state.completedLessons[k]).length;
  const pct = Math.round((done / total) * 100);
  dom.progressText.textContent = pct + '%';
  dom.progressFill.style.width = pct + '%';
}

function saveProgress() {
  localStorage.setItem('pycamp_progress', JSON.stringify(state.completedLessons));
}

function loadProgress() {
  try {
    const saved = localStorage.getItem('pycamp_progress');
    if (saved) state.completedLessons = JSON.parse(saved) || {};
  } catch (e) {
    state.completedLessons = {};
  }
}

function resetProgress() {
  if (!confirm('Сбросить весь прогресс курса?')) return;
  state.completedLessons = {};
  localStorage.removeItem('pycamp_progress');
  localStorage.removeItem('pycamp_current_lesson');
  updateProgress();
  renderSidebar();
  renderLessonDots();
  loadLesson(ALL_LESSONS[0].id);
  showToast('Прогресс сброшен', 'info');
}

/* ---------- Подсказка / решение / сброс ---------- */

function toggleHint() {
  const box = $('hintBox');
  if (box) box.classList.toggle('show');
}

function showSolution() {
  const lesson = findLesson(state.currentLessonId);
  if (!lesson || !lesson.solution) return;
  if (!confirm('Показать готовое решение? Вы потеряете возможность самостоятельно решить задачу.')) return;
  editor.setValue(lesson.solution);
  showToast('Решение загружено', 'info');
}

function resetCode() {
  const lesson = findLesson(state.currentLessonId);
  if (!lesson) return;
  editor.setValue(lesson.starter || '');
  dom.console.innerHTML = '';
  dom.testResults.classList.remove('show');
  showToast('Код сброшен', 'info');
}

/* ---------- Toast ---------- */

function showToast(msg, type = 'info') {
  dom.toast.textContent = msg;
  dom.toast.className = 'toast ' + type;
  dom.toast.classList.add('show');
  clearTimeout(dom.toast._timer);
  dom.toast._timer = setTimeout(() => dom.toast.classList.remove('show'), 3000);
}

/* ---------- Модалка ---------- */

function showModal(icon, title, text) {
  dom.modalIcon.textContent = icon;
  dom.modalTitle.textContent = title;
  dom.modalText.textContent = text;
  dom.modal.classList.add('show');
}

function closeModal() {
  dom.modal.classList.remove('show');
}

/* ---------- Заглушки навигации ---------- */

function goHome() { loadLesson(ALL_LESSONS[0].id); }
function goCurriculum() {
  dom.sidebar.classList.add('open');
}
function goForum() { showToast('Форум сообщества скоро будет доступен 🚧', 'info'); }
function goCert() {
  const done = Object.keys(state.completedLessons).filter(k => state.completedLessons[k]).length;
  const pct = Math.round((done / ALL_LESSONS.length) * 100);
  if (pct === 100) {
    showModal('🎓', 'Ваш сертификат готов!', `Вы прошли весь курс Python на 100%! Поздравляем! К сожалению, выпуск официального сертификата пока в разработке, но вы можете гордиться своим достижением.`);
  } else {
    showToast(`Пройдено ${pct}% курса. Завершите все уроки для сертификата.`, 'info');
  }
}
function goAbout() {
  showModal('ℹ️', 'О проекте PyCamp', 'PyCamp — бесплатная платформа для изучения Python прямо в браузере. Код выполняется через Pyodide (Python, скомпилированный в WebAssembly). Курс содержит 7 модулей и более 25 уроков: от Hello World до ООП и декораторов. Учитесь бесплатно, в любом месте, без установки.');
}

/* ---------- Мобильное меню ---------- */

$('menuToggle').onclick = () => dom.sidebar.classList.toggle('open');

/* ---------- Старт ---------- */

window.addEventListener('load', initApp);
</script>

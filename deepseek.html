<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyCamp — бесплатный курс Python</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
<style>
  :root{
    --bg:#0a0a23;
    --panel:#1b1b32;
    --panel2:#2a2a40;
    --border:#3b3b4f;
    --text:#f5f6f7;
    --muted:#8b8b9e;
    --accent:#f1be32;
    --green:#acd157;
    --green-dark:#00471b;
    --red:#ff7b7b;
    --blue:#99c9ff;
    --purple:#dbb8ff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }
  /* ---------- Header ---------- */
  header{
    flex:0 0 auto;
    height:58px;
    display:flex;
    align-items:center;
    gap:16px;
    padding:0 18px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    z-index:50;
  }
  .logo{
    font-weight:800;
    font-size:19px;
    letter-spacing:-.4px;
    display:flex;
    align-items:center;
    gap:9px;
    white-space:nowrap;
  }
  .logo .py{
    background:linear-gradient(135deg,#3776ab,#ffd43b);
    color:#0a0a23;
    padding:3px 8px;
    border-radius:6px;
    font-size:14px;
    font-weight:900;
  }
  .progress-wrap{
    flex:1;
    display:flex;
    align-items:center;
    gap:12px;
    max-width:520px;
    margin:0 auto;
  }
  .progress-bar{
    flex:1;
    height:9px;
    background:var(--panel2);
    border-radius:99px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--green),var(--accent));
    border-radius:99px;
    transition:width .4s ease;
  }
  .progress-label{
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .hdr-btn{
    background:transparent;
    border:1px solid var(--border);
    color:var(--muted);
    padding:7px 12px;
    border-radius:6px;
    cursor:pointer;
    font-size:13px;
    transition:.15s;
    white-space:nowrap;
  }
  .hdr-btn:hover{color:var(--text);border-color:var(--muted);}
  #burger{display:none;font-size:20px;padding:4px 10px;line-height:1;}
  .status-dot{
    width:8px;height:8px;border-radius:50%;
    background:#5a5a70;
    display:inline-block;
    margin-right:7px;
    transition:.3s;
  }
  .status-dot.ready{background:var(--green);box-shadow:0 0 8px var(--green);}
  .status-dot.loading{background:var(--accent);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  /* ---------- Layout ---------- */
  .app{flex:1;display:flex;min-height:0;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:310px;
    flex:0 0 310px;
    background:var(--panel);
    border-right:1px solid var(--border);
    overflow-y:auto;
    padding:14px 0 40px;
  }
  .sidebar::-webkit-scrollbar,.content::-webkit-scrollbar{width:9px;}
  .sidebar::-webkit-scrollbar-thumb,.content::-webkit-scrollbar-thumb{
    background:#33334a;border-radius:9px;
  }
  .module-title{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--muted);
    padding:18px 18px 8px;
    font-weight:700;
  }
  .nav-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 18px;
    cursor:pointer;
    font-size:14px;
    color:#c9c9d6;
    border-left:3px solid transparent;
    transition:.12s;
    user-select:none;
  }
  .nav-item:hover{background:var(--panel2);color:#fff;}
  .nav-item.active{
    background:var(--panel2);
    border-left-color:var(--accent);
    color:#fff;
    font-weight:600;
  }
  .nav-item .num{
    font-size:11px;
    color:var(--muted);
    min-width:18px;
    text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .nav-item.done .num{color:var(--green);}
  .nav-item.done .num::before{content:"✓";}
  .nav-item.done .num span{display:none;}
  .nav-item .lbl{flex:1;line-height:1.3;}

  /* ---------- Content ---------- */
  .content{
    flex:1;
    overflow-y:auto;
    padding:34px 44px 90px;
    scroll-behavior:smooth;
  }
  .inner{max-width:860px;margin:0 auto;}

  .crumb{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1.1px;
    color:var(--accent);
    font-weight:700;
    margin-bottom:8px;
  }
  h1.lesson-title{
    font-size:31px;
    margin:0 0 22px;
    line-height:1.2;
    letter-spacing:-.5px;
  }
  .theory{font-size:15.5px;line-height:1.75;color:#dcdce6;}
  .theory p{margin:0 0 15px;}
  .theory ul,.theory ol{margin:0 0 15px;padding-left:22px;}
  .theory li{margin-bottom:7px;}
  .theory code{
    background:#26263c;
    color:var(--accent);
    padding:2px 6px;
    border-radius:4px;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:.88em;
  }
  .theory pre{
    background:#0d0d1f;
    border:1px solid var(--border);
    border-left:3px solid var(--blue);
    border-radius:8px;
    padding:14px 16px;
    overflow-x:auto;
    margin:0 0 18px;
    line-height:1.6;
  }
  .theory pre code{
    background:none;
    color:#d8d8e8;
    padding:0;
    font-size:13.5px;
  }
  .theory strong{color:#fff;}
  .callout{
    background:#1d2a1f;
    border:1px solid #2f4a33;
    border-left:4px solid var(--green);
    border-radius:8px;
    padding:13px 16px;
    margin:0 0 18px;
    font-size:14.5px;
  }
  .callout.warn{
    background:#2c2418;
    border-color:#4d3d1c;
    border-left-color:var(--accent);
  }
  .callout b{color:#fff;}

  /* ---------- Exercise ---------- */
  .task-box{
    background:var(--panel);
    border:1px solid var(--border);
    border-left:4px solid var(--accent);
    border-radius:10px;
    padding:18px 20px;
    margin:28px 0 22px;
  }
  .task-box h3{
    margin:0 0 10px;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1.1px;
    color:var(--accent);
  }
  .task-box p{margin:0 0 10px;font-size:15px;line-height:1.65;}
  .task-box ul{margin:0;padding-left:20px;}
  .task-box li{margin-bottom:6px;font-size:15px;line-height:1.6;}
  .task-box code{
    background:#26263c;color:var(--green);padding:2px 6px;border-radius:4px;
    font-family:"SF Mono",Consolas,Monaco,monospace;font-size:.88em;
  }

  .editor-card{
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    background:#0d0d1f;
  }
  .editor-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel2);
    padding:8px 12px;
    border-bottom:1px solid var(--border);
  }
  .dots{display:flex;gap:6px;}
  .dots i{width:10px;height:10px;border-radius:50%;display:block;}
  .dots i:nth-child(1){background:#ff5f56;}
  .dots i:nth-child(2){background:#ffbd2e;}
  .dots i:nth-child(3){background:#27c93f;}
  .filename{
    font-size:12.5px;
    color:var(--muted);
    font-family:"SF Mono",Consolas,Monaco,monospace;
    margin-left:12px;
  }
  .editor-head .hint-key{font-size:11.5px;color:#66667d;}
  #editor{
    width:100%;
    min-height:230px;
    background:#0d0d1f;
    color:#e6e6f0;
    border:none;
    outline:none;
    resize:vertical;
    padding:16px;
    font-family:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    font-size:14px;
    line-height:1.65;
    tab-size:4;
    display:block;
  }
  #editor::selection{background:#3a3a5c;}

  .actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:14px;
    align-items:center;
  }
  button.btn{
    border:none;
    border-radius:7px;
    padding:11px 20px;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    transition:.15s;
    font-family:inherit;
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  button.btn:active{transform:translateY(1px);}
  .btn-run{background:var(--panel2);color:var(--text);border:1px solid var(--border);}
  .btn-run:hover{background:#3a3a55;}
  .btn-check{background:var(--green-dark);color:#e8ffd6;border:1px solid #2f6b3a;}
  .btn-check:hover{background:#005c24;}
  .btn-check:disabled,.btn-run:disabled{opacity:.5;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
  .btn-ghost:hover{color:var(--text);border-color:var(--muted);}
  .spacer{flex:1;}

  .output{
    margin-top:14px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#0d0d1f;
    overflow:hidden;
    display:none;
  }
  .output.show{display:block;}
  .output-head{
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:1px;
    padding:8px 14px;
    background:var(--panel2);
    color:var(--muted);
    font-weight:700;
    border-bottom:1px solid var(--border);
  }
  .output-body{
    padding:14px;
    font-family:"SF Mono",Consolas,Monaco,monospace;
    font-size:13.5px;
    line-height:1.6;
    white-space:pre-wrap;
    word-break:break-word;
    color:#d8d8e8;
    max-height:340px;
    overflow-y:auto;
  }
  .output.success .output-head{background:#123322;color:var(--green);border-color:#1d4d31;}
  .output.success .output-body{color:#c8f0d5;}
  .output.error .output-head{background:#3a1a1a;color:var(--red);border-color:#5c2626;}
  .output.error .output-body{color:#ffc9c9;}

  .solution-box{
    display:none;
    margin-top:14px;
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    background:#0d0d1f;
  }
  .solution-box.show{display:block;}
  .solution-box .output-head{background:#2a2140;color:var(--purple);}

  /* ---------- Footer nav ---------- */
  .lesson-nav{
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin-top:44px;
    padding-top:24px;
    border-top:1px solid var(--border);
  }
  .lesson-nav button{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    font-family:inherit;
    text-align:left;
    transition:.15s;
    max-width:48%;
  }
  .lesson-nav button:hover:not(:disabled){border-color:var(--accent);}
  .lesson-nav button:disabled{opacity:.3;cursor:default;}
  .lesson-nav .sm{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;}

  .overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:40;
  }
  .overlay.show{display:block;}

  .toast{
    position:fixed;
    bottom:26px;
    left:50%;
    transform:translateX(-50%) translateY(90px);
    background:var(--green-dark);
    border:1px solid #2f6b3a;
    color:#e8ffd6;
    padding:13px 26px;
    border-radius:10px;
    font-weight:600;
    font-size:14.5px;
    transition:transform .35s cubic-bezier(.2,.9,.3,1.3);
    z-index:100;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
    pointer-events:none;
  }
  .toast.show{transform:translateX(-50%) translateY(0);}

  /* ---------- Mobile ---------- */
  @media (max-width:860px){
    #burger{display:block;}
    .progress-wrap{display:none;}
    .sidebar{
      position:fixed;
      top:58px;left:0;bottom:0;
      z-index:45;
      transform:translateX(-100%);
      transition:transform .28s ease;
      box-shadow:6px 0 30px rgba(0,0,0,.5);
    }
    .sidebar.open{transform:translateX(0);}
    .content{padding:24px 18px 90px;}
    h1.lesson-title{font-size:24px;}
    .lesson-nav button{max-width:100%;font-size:13px;}
    .actions .btn{padding:10px 15px;font-size:13.5px;}
  }
</style>
</head>
<body>

<header>
  <button class="hdr-btn" id="burger">☰</button>
  <div class="logo"><span class="py">Py</span> PyCamp</div>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0 / 20</div>
  </div>
  <button class="hdr-btn" id="resetBtn">Сбросить прогресс</button>
</header>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content" id="content">
    <div class="inner" id="inner"></div>
  </main>
</div>

<div class="overlay" id="overlay"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   КУРС
   ========================================================= */
const COURSE = [
{
  module: "Модуль 1 · Основы языка",
  lessons: [
  {
    id: "l01",
    title: "Первая программа",
    theory: `
      <p><strong>Python</strong> — высокоуровневый язык программирования общего назначения, созданный Гвидо ван Россумом в 1991 году. Он читается почти как обычный английский текст, поэтому идеально подходит для первого языка.</p>
      <p>Самая первая команда, которую изучают все — <code>print()</code>. Она выводит значение на экран:</p>
      <pre><code>print("Привет, мир!")</code></pre>
      <p>Комментарии в Python начинаются со знака <code>#</code>. Интерпретатор их игнорирует — они нужны людям:</p>
      <pre><code># Это комментарий, он не выполняется
print("А это выполнится")</code></pre>
      <div class="callout"><b>Важно:</b> Python чувствителен к регистру. <code>print</code> и <code>Print</code> — совершенно разные вещи. Второе вызовет ошибку.</div>
      <p>Строки можно писать как в двойных, так и в одинарных кавычках: <code>"текст"</code> и <code>'текст'</code> — равнозначны.</p>
    `,
    task: `
      <p>Напишите программу, которая выводит на экран ровно одну строку:</p>
      <ul><li><code>Привет, мир!</code></li></ul>
      <p>Используйте функцию <code>print()</code>.</p>
    `,
    starter: `# Напишите ваш код ниже\n`,
    expected: `Привет, мир!`,
    solution: `print("Привет, мир!")`
  },
  {
    id: "l02",
    title: "Переменные и типы данных",
    theory: `
      <p><strong>Переменная</strong> — это имя, которое ссылается на значение в памяти. В Python не нужно объявлять тип заранее — он определяется автоматически.</p>
      <pre><code>name = "Алиса"      # строка (str)
age = 30            # целое число (int)
height = 1.68       # дробное число (float)
is_student = True   # логический (bool)</code></pre>
      <p>Узнать тип значения можно функцией <code>type()</code>:</p>
      <pre><code>print(type(age))   # &lt;class 'int'&gt;</code></pre>
      <p>Основные типы:</p>
      <ul>
        <li><code>int</code> — целые числа: <code>1</code>, <code>-42</code>, <code>1000</code></li>
        <li><code>float</code> — дробные: <code>3.14</code>, <code>-0.5</code></li>
        <li><code>str</code> — строки: <code>"привет"</code></li>
        <li><code>bool</code> — <code>True</code> или <code>False</code></li>
      </ul>
      <div class="callout"><b>Правила имён:</b> можно использовать буквы, цифры и <code>_</code>, но имя не может начинаться с цифры. Регистр важен: <code>Age</code> и <code>age</code> — разные переменные.</div>
    `,
    task: `
      <p>Создайте четыре переменные:</p>
      <ul>
        <li><code>name</code> со значением <code>"Python"</code></li>
        <li><code>year</code> со значением <code>1991</code></li>
        <li><code>pi</code> со значением <code>3.14</code></li>
        <li><code>is_cool</code> со значением <code>True</code></li>
      </ul>
    `,
    starter: `# Создайте переменные ниже\n`,
    test: `assert name == "Python", "name должно быть равно 'Python'"
assert year == 1991, "year должно быть равно 1991"
assert pi == 3.14, "pi должно быть равно 3.14"
assert is_cool is True, "is_cool должно быть True"`,
    solution: `name = "Python"\nyear = 1991\npi = 3.14\nis_cool = True`
  },
  {
    id: "l03",
    title: "Числа и арифметика",
    theory: `
      <p>Python умеет работать как калькулятор. Основные операторы:</p>
      <pre><code>7 + 3    # 10   сложение
7 - 3    # 4    вычитание
7 * 3    # 21   умножение
7 / 3    # 2.333...  деление (всегда float)
7 // 3   # 2    целочисленное деление
7 % 3    # 1    остаток от деления
7 ** 3   # 343  возведение в степень</code></pre>
      <div class="callout warn"><b>Обратите внимание:</b> оператор <code>/</code> всегда возвращает <code>float</code>, даже если делится нацело. <code>10 / 2</code> даст <code>5.0</code>, а не <code>5</code>.</div>
      <p>Порядок операций как в математике: сначала <code>**</code>, потом <code>* / // %</code>, потом <code>+ -</code>. Скобки меняют порядок.</p>
      <pre><code>2 + 3 * 4      # 14
(2 + 3) * 4    # 20</code></pre>
      <p>Сокращённые операторы присваивания:</p>
      <pre><code>x = 10
x += 5   # x теперь 15
x *= 2   # x теперь 30</code></pre>
    `,
    task: `
      <p>Даны числа <code>a = 17</code> и <code>b = 5</code>. Вычислите и сохраните в переменные:</p>
      <ul>
        <li><code>summa</code> — сумма</li>
        <li><code>raznost</code> — разность</li>
        <li><code>proizvedenie</code> — произведение</li>
        <li><code>chastnoe</code> — обычное деление</li>
        <li><code>celoe</code> — целочисленное деление</li>
        <li><code>ostatok</code> — остаток от деления</li>
        <li><code>stepen</code> — <code>a</code> в степени <code>b</code></li>
      </ul>
    `,
    starter: `a = 17\nb = 5\n\n# Вычислите значения ниже\n`,
    test: `assert summa == 22, "сумма должна быть 22"
assert raznost == 12, "разность должна быть 12"
assert proizvedenie == 85, "произведение должно быть 85"
assert abs(chastnoe - 3.4) < 1e-9, "частное должно быть 3.4"
assert celoe == 3, "целочисленное деление должно быть 3"
assert ostatok == 2, "остаток должен быть 2"
assert stepen == 17**5, "степень посчитана неверно"`,
    solution: `a = 17\nb = 5\n\nsumma = a + b\nraznost = a - b\nproizvedenie = a * b\nchastnoe = a / b\nceloe = a // b\nostatok = a % b\nstepen = a ** b`
  },
  {
    id: "l04",
    title: "Строки",
    theory: `
      <p>Строка — это последовательность символов. Строки можно складывать (конкатенация) и умножать:</p>
      <pre><code>greeting = "Привет" + ", " + "мир"
loud = "Ха" * 3      # "ХаХаХа"</code></pre>
      <p><strong>Индексация</strong> начинается с нуля. Отрицательные индексы считают с конца:</p>
      <pre><code>s = "Python"
s[0]   # 'P'   первый
s[-1]  # 'n'   последний
s[1:4] # 'yth' срез (не включая индекс 4)
s[::-1]# 'nohtyP' — переворот строки</code></pre>
      <p><strong>f-строки</strong> — самый удобный способ вставлять значения в текст:</p>
      <pre><code>name = "Алиса"
age = 30
print(f"Меня зовут {name}, мне {age} лет")</code></pre>
      <p>Полезные методы строк:</p>

    starter: `class Student:\n    def __init__(self, name, grades=None):\n        # Ваш код\n        pass\n\n    def add_grade(self, grade):\n        pass\n\n    def average(self):\n        pass\n\n    def __str__(self):\n        pass\n\n\ndef best_student(students):\n    pass\n`,
    test: `s1 = Student("Аня", [5, 4, 5])
s2 = Student("Борис")
s2.add_grade(3)
s2.add_grade(4)
assert s1.average() == 14/3
assert s2.average() == 3.5
assert Student("Пустой").average() == 0
assert "Аня" in str(s1)
assert "4.7" in str(s1)
assert best_student([s1, s2]) is s1
assert best_student([s2]) is s2
s3 = Student("Вера")
s3.add_grade(5)
assert best_student([s1, s2, s3]) is s3`,
    solution: `class Student:\n    def __init__(self, name, grades=None):\n        self.name = name\n        self.grades = list(grades) if grades else []\n\n    def add_grade(self, grade):\n        self.grades.append(grade)\n\n    def average(self):\n        if not self.grades:\n            return 0\n        return sum(self.grades) / len(self.grades)\n\n    def __str__(self):\n        return f"{self.name}: {self.average():.1f}"\n\n\ndef best_student(students):\n    return max(students, key=lambda s: s.average())`
  }
]}
];

/* =========================================================
   ПЛОСКИЙ СПИСОК УРОКОВ
   ========================================================= */
const ALL = [];
COURSE.forEach((mod, mi) => {
  mod.lessons.forEach((l, li) => {
    ALL.push(Object.assign({}, l, { moduleName: mod.module, mi, li }));
  });
});
const TOTAL = ALL.length;

/* =========================================================
   СОСТОЯНИЕ
   ========================================================= */
const P_KEY = 'pycamp_progress_v1';
const C_KEY = 'pycamp_code_v1';

let progress = {};
let savedCode = {};
try { progress = JSON.parse(localStorage.getItem(P_KEY) || '{}') || {}; } catch(e){ progress = {}; }
try { savedCode = JSON.parse(localStorage.getItem(C_KEY) || '{}') || {}; } catch(e){ savedCode = {}; }

let currentIndex = 0;

/* =========================================================
   ЗАГРУЗКА PYODIDE
   ========================================================= */
let pyodideInstance = null;
let pyodidePromise = null;

const RUNNER = `
import sys, io, traceback

def __run_usercode(user_code, test_code):
    ns = {'__name__': '__main__'}
    buf = io.StringIO()
    old_out, old_err = sys.stdout, sys.stderr
    sys.stdout = buf
    sys.stderr = buf
    ok = True
    try:
        exec(compile(user_code, '<main.py>', 'exec'), ns)
        if test_code and test_code.strip():
            exec(compile(test_code, '<tests>', 'exec'), ns)
    except Exception:
        traceback.print_exc()
        ok = False
    finally:
        sys.stdout = old_out
        sys.stderr = old_err
    return [buf.getvalue(), ok]
`;

function setStatus(state){
  const dot = document.getElementById('statusDot');
  if(!dot) return;
  dot.className = 'status-dot ' + state;
}

function getPyodide(){
  if(pyodidePromise) return pyodidePromise;
  setStatus('loading');
  pyodidePromise = loadPyodide({
    indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/'
  }).then(async py => {
    await py.runPython(RUNNER);
    pyodideInstance = py;
    setStatus('ready');
    return py;
  }).catch(err => {
    setStatus('');
    pyodidePromise = null;
    throw err;
  });
  return pyodidePromise;
}

async function execute(userCode, testCode){
  const py = await getPyodide();
  const fn = py.globals.get('__run_usercode');
  try{
    const res = fn(userCode, testCode || '');
    const output = res.get(0);
    const ok = res.get(1);
    res.destroy();
    return { output: output, ok: ok };
  } finally {
    fn.destroy();
  }
}

/* =========================================================
   ХЕЛПЕРЫ
   ========================================================= */
function norm(s){
  return String(s == null ? '' : s)
    .replace(/\r/g, '')
    .split('\n')
    .map(l => l.replace(/\s+$/, ''))
    .join('\n')
    .replace(/^\n+|\n+$/g, '');
}

function esc(s){
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

function completedCount(){
  return ALL.filter(l => progress[l.id]).length;
}

function updateProgressUI(){
  const done = completedCount();
  const pct = TOTAL ? Math.round(done / TOTAL * 100) : 0;
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  if(fill) fill.style.width = pct + '%';
  if(label) label.textContent = done + ' / ' + TOTAL;
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('show'), 2600);
}

function saveProgress(){
  try { localStorage.setItem(P_KEY, JSON.stringify(progress)); } catch(e){}
}
function saveCode(){
  try { localStorage.setItem(C_KEY, JSON.stringify(savedCode)); } catch(e){}
}

/* =========================================================
   SIDEBAR
   ========================================================= */
function renderSidebar(){
  const sb = document.getElementById('sidebar');
  let html = '';
  let counter = 0;
  COURSE.forEach(mod => {
    html += `<div class="module-title">${esc(mod.module)}</div>`;
    mod.lessons.forEach(l => {
      counter++;
      const done = progress[l.id] ? ' done' : '';
      const active = (ALL[currentIndex] && ALL[currentIndex].id === l.id) ? ' active' : '';
      html += `<div class="nav-item${done}${active}" data-id="${l.id}">
        <span class="num"><span>${counter}</span></span>
        <span class="lbl">${esc(l.title)}</span>
      </div>`;
    });
  });
  sb.innerHTML = html;
  sb.querySelectorAll('.nav-item').forEach(el => {
    el.addEventListener('click', () => {
      const idx = ALL.findIndex(l => l.id === el.dataset.id);
      if(idx >= 0){ goTo(idx); closeSidebar(); }
    });
  });
}

function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

/* =========================================================
   РЕНДЕР УРОКА
   ========================================================= */
function renderLesson(idx){
  currentIndex = idx;
  const l = ALL[idx];
  if(!l) return;

  const inner = document.getElementById('inner');
  const num = idx + 1;

  inner.innerHTML = `
    <div class="crumb">${esc(l.moduleName)} · Урок ${num} из ${TOTAL}</div>
    <h1 class="lesson-title">${esc(l.title)}</h1>
    <div class="theory">${l.theory}</div>

    <div class="task-box">
      <h3>Задание</h3>
      ${l.task}
    </div>

    <div class="editor-card">
      <div class="editor-head">
        <div style="display:flex;align-items:center">
          <div class="dots"><i></i><i></i><i></i></div>
          <span class="filename">main.py</span>
        </div>
        <span class="hint-key">Ctrl + Enter — запустить</span>
      </div>
      <textarea id="editor" spellcheck="false"></textarea>
    </div>

    <div class="actions">
      <button class="btn btn-run" id="runBtn">▶ Запустить</button>
      <button class="btn btn-check" id="checkBtn">✓ Проверить</button>
      <div class="spacer"></div>
      <button class="btn btn-ghost" id="solBtn">Показать решение</button>
      <button class="btn btn-ghost" id="resetCodeBtn">Сбросить код</button>
    </div>

    <div class="output" id="output">
      <div class="output-head" id="outputHead">Вывод</div>
      <div class="output-body" id="outputBody"></div>
    </div>

    <div class="solution-box" id="solutionBox">
      <div class="output-head">Эталонное решение</div>
      <div class="output-body" id="solutionBody"></div>
    </div>

    <div class="lesson-nav">
      <button id="prevBtn" ${idx === 0 ? 'disabled' : ''}>
        <span class="sm">← Назад</span>${idx > 0 ? esc(ALL[idx-1].title) : '—'}
      </button>
      <button id="nextBtn" ${idx === TOTAL-1 ? 'disabled' : ''}>
        <span class="sm">Далее →</span>${idx < TOTAL-1 ? esc(ALL[idx+1].title) : '—'}
      </button>
    </div>
  `;

  const editor = document.getElementById('editor');
  editor.value = (savedCode[l.id] !== undefined) ? savedCode[l.id] : l.starter;

  editor.addEventListener('input', () => {
    savedCode[l.id] = editor.value;
    saveCode();
  });

  editor.addEventListener('keydown', e => {
    if(e.key === 'Tab'){
      e.preventDefault();
      const s = editor.selectionStart, en = editor.selectionEnd;
      editor.value = editor.value.slice(0, s) + '    ' + editor.value.slice(en);
      editor.selectionStart = editor.selectionEnd = s + 4;
      savedCode[l.id] = editor.value; saveCode();
    }
    if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){
      e.preventDefault();
      doRun();
    }
  });

  document.getElementById('runBtn').addEventListener('click', doRun);
  document.getElementById('checkBtn').addEventListener('click', doCheck);
  document.getElementById('resetCodeBtn').addEventListener('click', () => {
    editor.value = l.starter;
    savedCode[l.id] = l.starter; saveCode();
    hideOutput();
    hideSolution();
  });
  document.getElementById('solBtn').addEventListener('click', () => {
    const box = document.getElementById('solutionBox');
    const body = document.getElementById('solutionBody');
    body.textContent = l.solution;
    box.classList.toggle('show');
  });
  document.getElementById('prevBtn').addEventListener('click', () => { if(idx > 0) goTo(idx-1); });
  document.getElementById('nextBtn').addEventListener('click', () => { if(idx < TOTAL-1) goTo(idx+1); });

  renderSidebar();
  updateProgressUI();
  document.getElementById('content').scrollTop = 0;
}

function goTo(idx){
  if(idx < 0 || idx >= TOTAL) return;
  renderLesson(idx);
}

function showOutput(text, type){
  const box = document.getElementById('output');
  const head = document.getElementById('outputHead');
  const body = document.getElementById('outputBody');
  box.className = 'output show ' + (type || '');
  head.textContent = type === 'success' ? 'Успех' : (type === 'error' ? 'Ошибка' : 'Вывод');
  body.textContent = text;
}

function hideOutput(){
  document.getElementById('output').className = 'output';
}

function hideSolution(){
  document.getElementById('solutionBox').classList.remove('show');
}

/* =========================================================
   ЗАПУСК И ПРОВЕРКА
   ========================================================= */
async function doRun(){
  const l = ALL[currentIndex];
  const editor = document.getElementById('editor');
  const runBtn = document.getElementById('runBtn');
  const checkBtn = document.getElementById('checkBtn');

  runBtn.disabled = true; checkBtn.disabled = true;
  runBtn.textContent = '⏳ Выполняется…';
  showOutput('Загрузка среды Python…', '');

  try{
    const res = await execute(editor.value, '');
    if(res.output && res.output.trim()){
      showOutput(res.output.replace(/\s+$/, ''), res.ok ? '' : 'error');
    } else {
      showOutput(res.ok ? '(программа выполнена, ничего не выведено)' : '(ошибка без вывода)', res.ok ? '' : 'error');
    }
  } catch(err){
    showOutput('Не удалось загрузить Python: ' + err.message, 'error');
  } finally {
    runBtn.disabled = false; checkBtn.disabled = false;
    runBtn.textContent = '▶ Запустить';
  }
}

async function doCheck(){
  const l = ALL[currentIndex];
  const editor = document.getElementById('editor');
  const runBtn = document.getElementById('runBtn');
  const checkBtn = document.getElementById('checkBtn');

  runBtn.disabled = true; checkBtn.disabled = true;
  checkBtn.textContent = '⏳ Проверка…';
  showOutput('Загрузка среды Python…', '');

  try{
    const res = await execute(editor.value, l.test || '');
    let ok = res.ok;
    let message = '';

    if(l.expected !== undefined){
      const got = norm(res.output);
      const want = norm(l.expected);
      if(got !== want){
        ok = false;
        message = 'Ожидался вывод:\n' + want + '\n\nПолучен вывод:\n' + (got || '(пусто)');
      } else {
        message = 'Вывод совпадает с ожидаемым:\n' + got;
      }
    } else {
      message = res.output.trim() || 'Все проверки пройдены.';
    }

    if(ok){
      showOutput(message + '\n\n✓ Задание выполнено!', 'success');
      if(!progress[l.id]){
        progress[l.id] = true;
        saveProgress();
        renderSidebar();
        updateProgressUI();
        toast('Урок пройден! 🎉');
      }
    } else {
      showOutput(message, 'error');
    }
  } catch(err){
    showOutput('Не удалось загрузить Python: ' + err.message, 'error');
  } finally {
    runBtn.disabled = false; checkBtn.disabled = false;
    checkBtn.textContent = '✓ Проверить';
  }
}

/* =========================================================
   ИНИЦИАЛИЗАЦИЯ
   ========================================================= */
document.getElementById('burger').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
});
document.getElementById('overlay').addEventListener('click', closeSidebar);

document.getElementById('resetBtn').addEventListener('click', () => {
  if(!confirm('Сбросить весь прогресс и сохранённый код?')) return;
  progress = {};
  savedCode = {};
  saveProgress();
  saveCode();
  renderLesson(currentIndex);
  toast('Прогресс сброшен');
});

// Индикатор статуса в шапке
(function addStatus(){
  const label = document.getElementById('progressLabel');
  if(label){
    const dot = document.createElement('span');
    dot.className = 'status-dot';
    dot.id = 'statusDot';
    dot.title = 'Статус Python-среды';
    label.parentNode.insertBefore(dot, label);
  }
})();

// Старт
renderSidebar();
renderLesson(0);
updateProgressUI();

// Предзагрузка Pyodide в фоне (не блокирует интерфейс)
window.addEventListener('load', () => {
  setTimeout(() => { getPyodide().catch(() => {}); }, 800);
});
</script>
</body>
</html>

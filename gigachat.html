<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyCamp: Курс Python в браузере</title>
    <style>
        :root {
            --bg-dark: #1e1e1e;
            --bg-sidebar: #252526;
            --text-light: #d4d4d4;
            --text-muted: #858585;
            --accent: #007acc;
            --border: #333333;
            --console-bg: #000000;
            --console-text: #00ff00;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; overflow: hidden; background-color: var(--bg-dark); color: var(--text-light); }
        
        #sidebar {
            width: 250px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 1rem;
        }
        #sidebar h2 { font-size: 1.2rem; margin-bottom: 1rem; color: var(--accent); text-align: center; }
        #lesson-list { list-style: none; }
        #lesson-list li { margin-bottom: 0.5rem; }
        #lesson-list button {
            width: 100%;
            text-align: left;
            padding: 0.5rem 1rem;
            border: none;
            background: none;
            color: var(--text-light);
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.95rem;
            transition: 0.2s;
        }
        #lesson-list button:hover { background-color: #37373d; }
        #lesson-list button.active { background-color: var(--accent); color: #000; }

        #main-content { flex-grow: 1; display: flex; flex-direction: column; }
        
        #lesson-info {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            background-color: #2d2d2d;
        }
        #lesson-title { font-size: 1.5rem; margin-bottom: 0.5rem; }
        #lesson-desc { color: var(--text-muted); line-height: 1.6; }

        #editor-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 1rem;
            gap: 1rem;
        }
        #code-editor {
            width: 100%;
            height: 40%;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.95rem;
            background-color: var(--bg-dark);
            color: var(--text-light);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1rem;
            resize: vertical;
            outline: none;
        }
        #controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        #run-btn {
            padding: 0.6rem 1.5rem;
            background-color: var(--accent);
            color: #000;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }
        #run-btn:hover { background-color: #005a87; }
        #task-block {
            background-color: #2d2d2d;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1rem;
        }
        #task-title { font-weight: bold; margin-bottom: 0.5rem; }
        #console-output {
            height: 50%;
            background-color: var(--console-bg);
            color: var(--console-text);
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.9rem;
            border-radius: 4px;
            padding: 1rem;
            overflow-y: auto;
            white-space: pre-wrap;
            border: 1px solid #003300;
        }

        @media (max-width: 800px) {
            #sidebar { width: 200px; }
            #lesson-title { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>PyCamp: Python</h2>
    <ul id="lesson-list"></ul>
</div>

<div id="main-content">
    <div id="lesson-info">
        <div id="lesson-title">Выберите урок</div>
        <div id="lesson-desc">Нажмите на пункт в меню слева, чтобы начать обучение.</div>
    </div>
    <div id="editor-container">
        <div id="task-block" style="display: none;">
            <div id="task-title">Задание:</div>
            <div id="task-text"></div>
        </div>
        <textarea id="code-editor"># Здесь будет код примера
print("Привет, PyCamp!")</textarea>
        <div id="controls">
            <button id="run-btn">▶ Запустить код</button>
            <span id="status-text" style="color: #858585;"></span>
        </div>
        <div id="console-output"></div>
    </div>
</div>

<script>
// === БАЗА ДАННЫХ КУРСА ===
const lessons = [
    {
        id: 0,
        title: "1. Привет, мир!",
        desc: "Первая программа. Функция print() выводит текст в консоль.",
        task: "Измените текст внутри кавычек на 'Привет от Python!' и запустите код.",
        code: `# Функция print выводит данные на экран
print("Привет, мир!")`
    },
    {
        id: 1,
        title: "2. Переменные и типы данных",
        desc: "Переменные хранят данные. Основные типы: int (целые), float (дробные), str (строки).",
        task: "Создайте переменную name со своим именем и переменную age с возрастом. Выведите их в консоль.",
        code: `# Присваивание значений
name = "Алексей"
age = 25

print("Имя:", name)
print("Возраст:", age)
print("Тип возраста:", type(age))`
    },
    {
        id: 2,
        title: "3. Калькулятор: Арифметика",
        desc: "Python отлично подходит для математических вычислений.",
        task: "Посчитайте площадь прямоугольника. Создайте переменные width=10 и height=5, вычислите area = width * height и выведите результат.",
        code: `a = 10
b = 3

print("Сумма:", a + b)
print("Разность:", a - b)
print("Произведение:", a * b)
print("Деление:", a / b)
print("Целочисленное деление:", a // b)
print("Остаток от деления:", a % b)
print("Возведение в степень:", a ** 2)`
    },
    {
        id: 3,
        title: "4. Условные операторы (if, else)",
        desc: "Позволяют выполнять код в зависимости от условий.",
        task: "Создайте переменную temperature = 15. Если температура больше 20, выведите 'Жарко', иначе выведите 'Нормально'.",
        code: `age = 18

if age >= 18:
    print("Доступ разрешен")
else:
    print("Доступ запрещен")`
    },
    {
        id: 4,
        title: "5. Списки (Lists)",
        desc: "Списки хранят упорядоченные наборы данных. Индексация начинается с 0.",
        task: "Создайте список fruits = ['яблоко', 'банан']. Добавьте в конец 'апельсин' и выведите второй элемент списка.",
        code: `numbers = [10, 20, 30, 40, 50]

print(numbers[0])    # Первый элемент
print(numbers[-1])   # Последний элемент
print(numbers[1:4])  # Срез со 2-го по 4-й элемент

numbers.append(60)   # Добавить в конец
print(numbers)`
    },
    {
        id: 5,
        title: "6. Циклы (for и while)",
        desc: "Циклы нужны для повторения действий.",
        task: "Используя цикл for, выведите в консоль числа от 1 до 5.",
        code: `# Цикл for по списку
for fruit in ["яблоко", "груша", "слива"]:
    print(fruit)

# Цикл for с диапазоном
for i in range(5):
    print("Итерация", i)`
    },
    {
        id: 6,
        title: "7. Функции (def)",
        desc: "Функции помогают переиспользовать код и делать его чище.",
        task: "Напишите функцию multiply(x, y), которая возвращает произведение двух чисел. Вызовите её с аргументами 5 и 6.",
        code: `def greet(name):
    print("Привет,", name + "!")

greet("Мир")
greet("Python")`
    },
    {
        id: 7,
        title: "8. Словари (Dictionaries)",
        desc: "Словари хранят данные в формате ключ:значение.",
        task: "Создайте словарь пользователя с ключами 'login' и 'status'. Выведите статус пользователя.",
        code: `user = {
    "name": "Иван",
    "age": 30,
    "is_admin": True
}

print(user["name"]) # Доступ по ключу
print(user.get("email", "Не указано")) # Безопасный доступ`
    },
    {
        id: 8,
        title: "9. Чтение ввода (input)",
        desc: "Функция input() позволяет взаимодействовать с пользователем.",
        task: "Спросите у пользователя его любимый цвет и выведите сообщение 'Ваш любимый цвет — [цвет]'.",
        code: `# input() всегда возвращает строку
name = input("Введите ваше имя: ")
print("Добро пожаловать, " + name)`
    },
    {
        id: 9,
        title: "10. Обработка ошибок (try/except)",
        desc: "Позволяет программе не падать при ошибках (например, при вводе текста вместо числа).",
        task: "Напишите программу, которая просит ввести число. Если введено не число, выведите 'Ошибка: введите число'.",
        code: `try:
    num = int(input("Введите число: "))
    print("Вы ввели:", num)
except ValueError:
    print("Ошибка: это не число!")`
    }
];

// === ЛОГИКА ПРИЛОЖЕНИЯ ===
const lessonList = document.getElementById('lesson-list');
const lessonTitle = document.getElementById('lesson-title');
const lessonDesc = document.getElementById('lesson-desc');
const codeEditor = document.getElementById('code-editor');
const runBtn = document.getElementById('run-btn');
const consoleOutput = document.getElementById('console-output');
const taskBlock = document.getElementById('task-block');
const taskText = document.getElementById('task-text');
const statusText = document.getElementById('status-text');

let currentLesson = null;

// Рендер списка уроков
lessons.forEach(lesson => {
    const btn = document.createElement('button');
    btn.textContent = lesson.title;
    btn.onclick = () => loadLesson(lesson.id);
    lessonList.appendChild(btn);
});

function loadLesson(id) {
    currentLesson = lessons[id];
    
    // Обновляем кнопки
    document.querySelectorAll('#lesson-list button').forEach(btn => btn.classList.remove('active'));
    lessonList.children[id].classList.add('active');
    
    // Обновляем контент
    lessonTitle.textContent = currentLesson.title;
    lessonDesc.textContent = currentLesson.desc;
    taskText.textContent = currentLesson.task;
    codeEditor.value = currentLesson.code;
    consoleOutput.textContent = '';
    
    // Показываем блок с заданием, если оно есть
    if (currentLesson.task) {
        taskBlock.style.display = 'block';
    } else {
        taskBlock.style.display = 'none';
    }
}

// Переопределение встроенной функции print для вывода в HTML
function setupConsole() {
    const oldLog = console.log;
    console.log = function(...args) {
        const message = args.map(arg => {
            if (typeof arg === 'object') {
                return JSON.stringify(arg, null, 2);
            }
            return String(arg);
        }).join(' ');
        
        consoleOutput.textContent += message + '\n';
        consoleOutput.scrollTop = consoleOutput.scrollHeight;
        
        // Сохраняем стандартный вывод в настоящую консоль разработчика
        oldLog.apply(console, args);
    };
}

// Запуск кода пользователя
runBtn.onclick = () => {
    consoleOutput.textContent = '';
    statusText.textContent = 'Выполнение...';
    
    // Создаем безопасную песочницу
    const userCode = codeEditor.value;
    
    try {
        // Функция Function создает новую функцию из строки. 
        // Мы передаем в нее переопределенный print и сам код пользователя.
        const sandbox = new Function('print', `
            try {
                ${userCode}
            } catch (e) {
                console.error("Ошибка выполнения:", e.message);
            }
        `);
        
        sandbox(console.log);
        statusText.textContent = 'Код выполнен';
        statusText.style.color = '#a3be8c';
    } catch (err) {
        consoleOutput.textContent = 'Ошибка синтаксиса: ' + err.message;
        statusText.textContent = 'Ошибка';
        statusText.style.color = '#bf616a';
    }
};

// Загружаем первый урок по умолчанию
loadLesson(0);
setupConsole();
</script>

</body>
</html>
